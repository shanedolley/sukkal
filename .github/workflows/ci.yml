name: CI

# Every push, and every pull request. A failing check therefore reports before
# a reviewer reads the change, which is the point of it.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The same versions amaterasu runs: PostgreSQL 18, pgvector 0.8.6. The
    # tag is pinned, so a new release cannot change what CI tested.
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kpa_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Loopback inside the runner, so no TLS and no secret. src/db/connect.ts
      # allows a loopback host in the clear and requires encryption everywhere
      # else. DATABASE_URL is deliberately unset: nothing here migrates a real
      # database.
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/kpa_dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test

  # The web tier. It runs no database: every screen reads fixtures, and the one
  # route handler opens a connection at request time rather than at build time.
  # So this job needs no service container, and it says nothing about whether
  # that route works against a real database. test/webhooks.test.ts covers
  # that in the job above.
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Both packages, and the order matters. The webhook route imports
      # src/db/connect.ts, which lives in the root package and resolves `pg`
      # from the root's node_modules rather than from apps/web's. Installing
      # apps/web alone builds everything except that route, and then fails on
      # it with "Module not found: Can't resolve 'pg'". Proved by running this
      # job's steps against a clean checkout before writing it down.
      #
      # This mirrors how the application deploys: kpa-web and kpa-worker run
      # from one repository with both installed. KPA-68 removes the coupling by
      # making apps/web a real workspace of the root, which is the version that
      # cannot break this way.
      - run: npm ci

      - run: npm ci
        working-directory: apps/web

      # The twelve checks under apps/web/scripts. Each proves one rule the
      # screens rest on, and each fails when that rule breaks.
      - run: npm run check
        working-directory: apps/web

      # next build type-checks the whole app, which is what catches the route
      # handler's cross-package import breaking. Nothing else would.
      - run: npm run build
        working-directory: apps/web

      - run: npm run lint
        working-directory: apps/web
