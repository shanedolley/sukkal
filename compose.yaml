# Sukkal on amaterasu. ADR-0026 says why, docs/runbooks/deploy.md says how.
#
# Host networking, because Postgres on amaterasu listens only on localhost and
# 192.168.20.110. The web tier binds 127.0.0.1 unless SUKKAL_WEB_HOST says
# otherwise, so the box opens no new port.
#
# No secret appears in this file or in `docker inspect`. The env file is mounted
# read-only and Node reads it with --env-file.

name: sukkal

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

x-app: &app
  image: sukkal:${SUKKAL_TAG:?set SUKKAL_TAG to the image tag, see docs/runbooks/deploy.md}
  network_mode: host
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  volumes:
    - ${SUKKAL_ENV_FILE:-/etc/sukkal/env}:/run/sukkal/env:ro
  logging: *logging

services:
  web:
    <<: *app
    working_dir: /app/apps/web
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    command:
      - node
      - --env-file=/run/sukkal/env
      - ../../node_modules/next/dist/bin/next
      - start
      - --hostname
      - "${SUKKAL_WEB_HOST:-127.0.0.1}"
      - --port
      - "${SUKKAL_WEB_PORT:-3000}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:${SUKKAL_WEB_PORT:-3000}/', {redirect: 'manual'}).then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    working_dir: /app

  # Sukkal's own tunnel. The other cloudflared container on the box serves
  # another domain and shares nothing with this one.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    network_mode: host
    restart: unless-stopped
    command: [tunnel, run, --token-file, /run/sukkal/tunnel-token]
    volumes:
      - ${SUKKAL_TUNNEL_TOKEN_FILE:-/etc/sukkal/tunnel-token}:/run/sukkal/tunnel-token:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
